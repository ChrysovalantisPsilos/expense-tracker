# Deletes remote branches whose work is already in develop
# (scripts/branch-cleanup.mjs has the rules: never main, develop or keep/…;
# only branches fully contained in develop, not sitting on develop's tip,
# last commit at least a day old). Runs daily and by hand from the Actions
# tab, where "dry run" only lists the branches. (Not on every push: a branch
# must be a day old anyway.)
name: branch-cleanup
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the branches that would be deleted
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete merged branches
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node scripts/branch-cleanup.mjs
