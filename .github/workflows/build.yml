# Full build gate: install the dependencies and run the production build, so a
# dependency update that breaks the app fails HERE. The fast test.yml suite runs
# pure modules and never imports the deps, so it can't catch a broken dependency
# — this is the check to mark "required" in branch protection so Dependabot
# auto-merge waits for it.
#
# Uses `npm install` (not `npm ci`) because there's no committed lockfile;
# versions resolve from package.json's ranges at install time. No secrets
# needed: the client falls back to placeholder Supabase config when env vars are
# absent, so `vite build` succeeds without real keys.
name: build
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
