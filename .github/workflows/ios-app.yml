# The iOS app on a Mac: the core and the strings from the web's source, the
# Xcode project from project.yml (XcodeGen), a Simulator build, the tests
# (view models over fakes, Home's parity with the web's figures through the
# core, the snapshots) and the snapshot PNGs as an artifact. macOS minutes
# cost ten times Linux ones, so this runs only for the branches and paths
# that can change the app.
name: ios-app
on:
  push:
    branches: [ios-app-1b, ios-native, ios-phase2, develop]
    paths: ['ios/**', 'mobile-core/**', 'src/locales/**', 'package.json', 'package-lock.json', '.github/workflows/ios-app.yml']
  pull_request:
    paths: ['ios/**', 'mobile-core/**', 'src/locales/**', 'package.json', 'package-lock.json', '.github/workflows/ios-app.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: ios/Budgeer/Budgeer.xcodeproj
  SCHEME: Budgeer Dev
  DESTINATION: platform=iOS Simulator,name=iPhone 15,OS=17.5
  DERIVED: ios/Budgeer/DerivedData

jobs:
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core, strings and project
        run: npm run ios:prepare
      - name: Build for the Simulator
        run: >
          set -o pipefail &&
          xcodebuild build-for-testing
          -project "$PROJECT" -scheme "$SCHEME" -destination "$DESTINATION"
          -derivedDataPath "$DERIVED" -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          | tee build.log | grep -E "error:|warning: .*Budgeer/|BUILD|Compiling|\*\*"
      - name: Tests
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
          TEST_RUNNER_TZ: UTC
        run: >
          set -o pipefail &&
          xcodebuild test-without-building
          -project "$PROJECT" -scheme "$SCHEME" -destination "$DESTINATION"
          -derivedDataPath "$DERIVED" -resultBundlePath TestResults.xcresult
          | tee test.log | grep -E "error:|Test Case|Test Suite|Executed|\*\*"
      - name: Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/*.png
          if-no-files-found: warn
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
