# The iOS app on a Mac, in one job: the core and the strings from the web's
# source, the core's Swift package tests (the recorded vectors replayed
# through JavaScriptCore), the Xcode project from project.yml (XcodeGen), a
# Simulator build, the app's tests (view models over fakes, parity with the
# web's figures through the core, the snapshots) and the snapshot PNGs as an
# artifact.
#
# macOS minutes cost ten times Linux ones, so this runs only on pushes to
# develop that touch the app, on pull requests, and by hand (Actions → ios-app
# → Run workflow, picking the branch) for a feature branch. A newer push to
# the same branch cancels the run in progress. The Linux replay of the core
# (test/mobileCore.test.js in ci) checks every push.
#
# The snapshot tests (every screen in light, dark and Greek) take most of the
# run (~20 of ~27 minutes), so they run only when pictures are wanted: a run
# by hand with "snapshots" ticked (the default for runs by hand). Pushes to
# develop and pull requests run the build, the core replay and every other
# test, in a few minutes.
name: ios-app
on:
  push:
    branches: [develop]
    paths: ['ios/**', 'mobile-core/**', 'src/locales/**', 'package.json', 'package-lock.json', '.github/workflows/ios-app.yml']
  pull_request:
    paths: ['ios/**', 'mobile-core/**', 'src/locales/**', 'package.json', 'package-lock.json', '.github/workflows/ios-app.yml']
  workflow_dispatch:
    inputs:
      snapshots:
        description: Also take the snapshot pictures (slow, ~20 min)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: ios/Budgeer/Budgeer.xcodeproj
  SCHEME: Budgeer Dev
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
  DERIVED: ios/Budgeer/DerivedData

jobs:
  app:
    runs-on: macos-26
    # A hung Simulator would otherwise burn up to six hours of macOS minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app && xcodebuild -version
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen
      # Swift packages (supabase-swift and friends) come from the cache when
      # the pins haven't changed.
      - name: Swift package cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Budgeer/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode26.5-${{ hashFiles('ios/Budgeer/project.yml', 'ios/BudgeerCore/Package.swift') }}
      - name: Core, strings and project
        run: npm run ios:prepare
      - name: Core package tests (JavaScriptCore replay)
        run: npm run core:vectors && cd ios/BudgeerCore && TZ=UTC swift test
      - name: Build for the Simulator
        run: >
          set -o pipefail &&
          xcodebuild build-for-testing
          -project "$PROJECT" -scheme "$SCHEME" -destination "$DESTINATION"
          -derivedDataPath "$DERIVED" -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          | tee build.log | grep -E "error:|warning: .*Budgeer/|BUILD|Compiling|\*\*"
      - name: Tests
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
          TEST_RUNNER_TZ: UTC
          # 'true' only on a run by hand with "snapshots" ticked.
          TAKE_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshots }}
        run: |
          set -o pipefail
          SKIP=""
          if [ "$TAKE_SNAPSHOTS" != "true" ]; then SKIP="-skip-testing:BudgeerTests/SnapshotTests"; fi
          xcodebuild test-without-building \
            -project "$PROJECT" -scheme "$SCHEME" -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED" -resultBundlePath TestResults.xcresult \
            $SKIP \
          | tee test.log | grep -E "error:|Test Case|Test Suite|Executed|\*\*"
      - name: Snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/*.png
          if-no-files-found: warn
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
