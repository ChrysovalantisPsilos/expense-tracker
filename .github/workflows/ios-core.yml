# The mobile core on a Mac: build the JavaScript core, record the vectors
# from the unit tests, then replay them through JavaScriptCore with the
# Swift package's tests (ios/README.md). macOS minutes cost ten times
# Linux ones, so this runs only for the branches and paths that can change
# the answer; the Linux replay in ci (test/mobileCore.test.js) runs on
# every push.
name: ios-core
on:
  push:
    branches: [ios-native, ios-phase2, ios-phase3, develop]
    paths: ['mobile-core/**', 'ios/**', 'src/**', 'supabase/functions/_shared/**', 'test/**', 'package.json', 'package-lock.json', '.github/workflows/ios-core.yml']
  pull_request:
    paths: ['mobile-core/**', 'ios/**', 'src/**', 'supabase/functions/_shared/**', 'test/**', 'package.json', 'package-lock.json', '.github/workflows/ios-core.yml']

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app && swift --version
      - name: Build the core
        run: npm run core:build
      - name: Record the vectors
        run: npm run core:vectors
      - name: Swift tests (JavaScriptCore replay)
        working-directory: ios/BudgeerCore
        env:
          TZ: UTC
        run: swift test
