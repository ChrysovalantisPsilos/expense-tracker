# Fills in App Store Connect for one of the two iOS apps, through the App
# Store Connect API (scripts/asc/store-info.mjs; the texts are
# ios/store/*.json): TestFlight's test information and beta review details,
# the newest build's What to Test, the external group "Public" with its public
# link and the build in it, and, when `submit` is on, the build's Beta App
# Review submission; then the App Store page (name, subtitle, category, age
# rating, description, keywords, promotional text, URLs, copyright, App Review
# details, and screenshots once ios/store/screenshots/<locale>/ exists). It
# never submits the App Store version. Safe to run again: it writes only what
# differs. By hand only (Actions → ios-store-info → Run workflow).
#
# Secrets (repository → Settings → Secrets and variables → Actions), by name:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   the App Store Connect API key (Admin)
#   ASC_CONTACT_EMAIL, ASC_CONTACT_PHONE    the review contact
#   REVIEW_EMAIL, REVIEW_PASSWORD           the reviewer's sign-in on Budgeer (PROD)
#   REVIEW_EMAIL_DEV, REVIEW_PASSWORD_DEV   the reviewer's sign-in on Budgeer Dev (TEST)
# Nothing here prints a secret; the run stops at once, naming any that is
# missing.
name: ios-store-info
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app: dev = "Budgeer Dev" (TEST), prod = "Budgeer" (PROD)'
        type: choice
        options: [dev, prod]
        default: dev
      submit:
        description: 'Submit the newest build for Beta App Review (external testing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-store-info-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  store-info:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No packages: the script uses Node's own crypto and fetch.
      - name: App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_CONTACT_EMAIL: ${{ secrets.ASC_CONTACT_EMAIL }}
          ASC_CONTACT_PHONE: ${{ secrets.ASC_CONTACT_PHONE }}
          # Both logins go in under their own names; the script takes the
          # one for the app picked (never the other as a fallback).
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          REVIEW_PASSWORD: ${{ secrets.REVIEW_PASSWORD }}
          REVIEW_EMAIL_DEV: ${{ secrets.REVIEW_EMAIL_DEV }}
          REVIEW_PASSWORD_DEV: ${{ secrets.REVIEW_PASSWORD_DEV }}
        run: node scripts/asc/store-info.mjs --app "${{ inputs.app }}" --submit "${{ inputs.submit }}"
