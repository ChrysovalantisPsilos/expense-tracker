# Deploys the public status page (status/, a Cloudflare Worker). Not part of
# the app release: it runs only when status/ or this file changes on
# status-page or main, or by hand.
#
# Needs the GitHub secret CLOUDFLARE_API_TOKEN (Workers Scripts + D1 edit).
# The account comes from status/wrangler.toml (account_id). The Supabase anon
# key reaches the Worker as the secret SUPABASE_ANON_KEY, copied from the
# GitHub secret STATUS_SUPABASE_ANON_KEY when that is set; without it the
# key-based checks report "unknown".
name: status-deploy
on:
  push:
    branches: [status-page, main]
    paths: ['status/**', '.github/workflows/status-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-deploy
  cancel-in-progress: false

env:
  WRANGLER_VERSION: '4.141.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_ANON_KEY: ${{ secrets.STATUS_SUPABASE_ANON_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: status
          command: d1 migrations apply budgeer-status --remote

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: status
          command: deploy

      # Piped on stdin so the key never appears in a command line or a file.
      - name: Set the SUPABASE_ANON_KEY Worker secret
        if: env.HAS_ANON_KEY == 'true'
        working-directory: status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANON_KEY: ${{ secrets.STATUS_SUPABASE_ANON_KEY }}
        run: printf '%s' "$ANON_KEY" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put SUPABASE_ANON_KEY
