# CI on every push/PR, before Vercel ships the commit:
#   unit tests (in UTC and in an east-of-UTC zone, so date bugs that only
#   show up away from UTC can't hide — see the test:* scripts), lint,
#   production build, and a dependency audit.
#
# Lint policy: `npm run lint` is strict (--max-warnings=0) — a warning fails
# the build just like an error.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm test` runs the suite twice: TZ=UTC and TZ=Europe/Brussels.
      - name: Unit tests (UTC + Europe/Brussels)
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Blocking at high severity (production dependencies only).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
