# CI on every push/PR (Vercel waits for it only once Deployment Checks are on;
# see README → Deploy):
#   unit tests (in UTC and in an east- and a west-of-UTC zone, so date bugs that only
#   show up away from UTC can't hide — see the test:* scripts), lint,
#   production build, and a dependency audit; plus a Deno lint of the
#   Edge Functions (functions job).
#
# Lint policy: `npm run lint` is strict (--max-warnings=0) — a warning fails
# the build just like an error.
name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm test` runs the suite three times: TZ=UTC, Europe/Brussels and America/Los_Angeles.
      - name: Unit tests (UTC + Europe/Brussels + America/Los_Angeles)
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Blocking at high severity (production dependencies only).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Edge Functions (Deno): static lint only, no network. A separate job so the
  # web checks above run exactly as before. DENO_NO_PACKAGE_JSON keeps Deno
  # from treating the repo's package.json as a workspace (whose rules forbid
  # the inline npm:/https: imports Supabase's runtime expects).
  # no-explicit-any is off because the functions pass untyped PostgREST rows.
  # Deno is pinned so a new release can't add rules under an unchanged repo.
  functions:
    runs-on: ubuntu-latest
    env:
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Lint Edge Functions
        run: deno lint --rules-exclude=no-explicit-any supabase/functions
