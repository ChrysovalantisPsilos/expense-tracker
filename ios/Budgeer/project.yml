# The Budgeer iOS app's Xcode project, generated by XcodeGen (never commit
# Budgeer.xcodeproj):  npm run ios:prepare   (core.js, the strings, then this)
# or, in this folder,  xcodegen generate
#
# Two environments, four configurations: Debug-Dev / Release-Dev point at the
# TEST Supabase project, Debug-Prod / Release-Prod at PROD (Config/*.xcconfig
# hold the URL and the public anon key; nothing in Swift). The "Budgeer Dev"
# scheme is the default; "Budgeer Prod" is for release builds only.
#
# Two apps, installable side by side: "Budgeer Dev" (com.budgeer.app.dev,
# the Dev configurations) and "Budgeer" (com.budgeer.app, Prod); the bundle
# id and the name come from Config/Dev.xcconfig and Prod.xcconfig. Signing is
# automatic with the team from Config/Local.xcconfig (not tracked) or, in
# CI, DEVELOPMENT_TEAM on the command line. Capabilities (entitlements per
# configuration, Config/Budgeer-*.entitlements): Push Notifications (the
# development APNs for a Debug build run from Xcode, production for a Release
# build: TestFlight and the App Store) and Sign in with Apple.
name: Budgeer
options:
  bundleIdPrefix: com.budgeer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  # Xcode 15 project format (object version 63): XcodeGen's default is
  # Xcode 16's, which Xcode 15.4 (CI) cannot open.
  projectFormat: xcode15_3
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  # Icon Composer documents (Resources/AppIcon.icon, AppIcon-Dev.icon) are
  # packages: one file to Xcode 26+, which builds the layered iOS 26 icon
  # (Liquid Glass, dark, tinted) and the older iOS sizes from it. Without
  # this XcodeGen would add the json and the layers one by one.
  fileTypes:
    icon:
      file: true
      buildPhase: resources

configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Prod: debug
  Release-Prod: release

configFiles:
  Debug-Dev: Config/Dev.xcconfig
  Release-Dev: Config/Dev.xcconfig
  Debug-Prod: Config/Prod.xcconfig
  Release-Prod: Config/Prod.xcconfig

packages:
  BudgeerCore:
    path: ../BudgeerCore
  # Pinned: 2.49.0 is the last supabase-swift on Swift tools 5.10 (2.50+
  # needs Xcode 16.3's tools 6.1; CI pins Xcode 15.4 on macos-14).
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.49.0
  # Supabase's transitive dependency, held back: 1.10 moved its sources to
  # Swift 6's access-level imports, which Xcode 15.4's compiler refuses.
  # Declared here only to bound the resolver; no target links it directly.
  IssueReporting:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    exactVersion: 1.9.0
  # The newest swift-clocks (1.1.1+) and swift-custom-dump (1.7.1+) depend on
  # the same library under its new name, swift-issue-reporting, while
  # supabase-swift 2.49.0 names it xctest-dynamic-overlay: a newer Xcode (16+)
  # resolves both and refuses the graph ("conflicting target name
  # IssueReporting"). Held below the rename so one name is used everywhere.
  Clocks:
    url: https://github.com/pointfreeco/swift-clocks
    minVersion: 1.0.0
    maxVersion: 1.1.1
  CustomDump:
    url: https://github.com/pointfreeco/swift-custom-dump
    minVersion: 1.0.0
    maxVersion: 1.7.1

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Simulator builds and tests need no team. A device build or an archive
    # takes DEVELOPMENT_TEAM from Config/Local.xcconfig (not tracked) or, in
    # CI, from the command line; never written here.
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # iPhone and iPad (each target says so again below).
    TARGETED_DEVICE_FAMILY: "1,2"
    # The version people see; the build number is the CI run's
    # (ios-testflight.yml passes CURRENT_PROJECT_VERSION), 1 locally.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Budgeer:
    type: application
    platform: iOS
    sources:
      - path: Budgeer
        excludes:
          # The fonts' licence texts stay in the repository, not in the app.
          - "Resources/Fonts/*.txt"
          - "Resources/LUCIDE-LICENSE.txt"
    dependencies:
      - package: BudgeerCore
      - package: Supabase
        product: Supabase
      # The widgets, embedded in the app (PlugIns).
      - target: BudgeerWidgets
    info:
      path: Budgeer/Info.plist
      properties:
        # "Budgeer" or "Budgeer Dev" under the icon (Config/*.xcconfig).
        CFBundleDisplayName: $(BUDGEER_DISPLAY_NAME)
        CFBundleName: Budgeer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # The iPhone stays upright; an iPad turns every way, which iPad
        # multitasking (Split View, Slide Over, Stage Manager) requires, with
        # the launch screen above and no UIRequiresFullScreen. The window's
        # width picks the frame (AppLayout: the sidebar or the tab bar).
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Only the system's own encryption (HTTPS/TLS through URLSession, the
        # Keychain) and a SHA-256 hash for Sign in with Apple's nonce, all
        # exempt; the database's encryption runs on the server. So no
        # export-compliance documents, and TestFlight builds aren't held.
        ITSAppUsesNonExemptEncryption: false
        # budgeer://auth-callback: where Google sign-in returns (a Redirect URL
        # in both Supabase projects; SupabaseAuthService.callback).
        # budgeer://join/<token>: an invite link opened in the app (RootView;
        # the website's https links stay as they are: Universal Links need
        # Associated Domains, a paid developer account's).
        CFBundleURLTypes:
          - CFBundleURLName: com.budgeer.app.auth
            CFBundleURLSchemes: [budgeer]
        CFBundleLocalizations: [en, el]
        # The Face ID lock (AppLock); each language's words are the generated
        # InfoPlist.strings (ios:native.lock.usage).
        NSFaceIDUsageDescription: Budgeer uses Face ID to keep your money private.
        # Scan a receipt on Add; each language's words are the generated
        # InfoPlist.strings (ios:native.receipt.cameraUsage).
        NSCameraUsageDescription: Budgeer uses the camera to read a receipt on this iPhone. The photo isn’t saved or uploaded.
        CFBundleDevelopmentRegion: en
        UIAppFonts:
          - Poppins-SemiBold.ttf
          - Poppins-Bold.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
        # From the xcconfig of the configuration being built (AppConfig.swift).
        BudgeerEnvironment: $(BUDGEER_ENV)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # Which APNs host this build's device token belongs to (AppConfig).
        APNSEnvironment: $(APNS_ENVIRONMENT)
        # The App Group shared with the widgets (WidgetShelf; Config/*.xcconfig).
        BudgeerAppGroup: $(BUDGEER_APP_GROUP)
    settings:
      base:
        # Per target, never in the shared xcconfig: a test bundle named like
        # the app writes the same Budgeer.swiftmodule and the build refuses.
        PRODUCT_NAME: Budgeer
        # com.budgeer.app.dev or com.budgeer.app (Config/*.xcconfig).
        PRODUCT_BUNDLE_IDENTIFIER: $(BUDGEER_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: "NO"
        # iPhone and iPad, said per target and not only in the project's
        # settings (XcodeGen's presets set it per target). An iPad build must
        # turn every way (UISupportedInterfaceOrientations~ipad above) or App
        # Store Connect refuses it (error 90474, iPad multitasking).
        TARGETED_DEVICE_FAMILY: "1,2"
        # The home-screen icon: Resources/AppIcon.icon, the layered Icon
        # Composer document (the mark's stem and its two arcs as glass layers
        # on the cream), with Assets.xcassets' AppIcon (one opaque 1024 px PNG)
        # under the same name for a build that can't read it. The Dev
        # configurations (the TEST project) take AppIcon-Dev: the same mark on
        # the dark ink with an amber DEV band, so the two installs are told apart.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Debug builds (run from Xcode) register with the development APNs,
      # Release builds (archived for TestFlight and the App Store) with
      # production; both may Sign in with Apple. The Dev configurations take
      # the Dev icon.
      configs:
        Debug-Dev:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
          CODE_SIGN_ENTITLEMENTS: Config/Budgeer-Debug.entitlements
          APNS_ENVIRONMENT: sandbox
        Debug-Prod:
          CODE_SIGN_ENTITLEMENTS: Config/Budgeer-Debug.entitlements
          APNS_ENVIRONMENT: sandbox
        Release-Dev:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
          CODE_SIGN_ENTITLEMENTS: Config/Budgeer-Release.entitlements
          APNS_ENVIRONMENT: production
        Release-Prod:
          CODE_SIGN_ENTITLEMENTS: Config/Budgeer-Release.entitlements
          APNS_ENVIRONMENT: production
    preBuildScripts:
      # The core and the strings must exist before anything compiles; the
      # scheme's pre-action builds them (scripts/prebuild.sh) and this phase
      # fails loudly if it did not run (a build started outside the scheme).
      - name: Check the core and the strings
        script: |
          /bin/bash "$SRCROOT/scripts/prebuild.sh" check
        basedOnDependencyAnalysis: false

  BudgeerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BudgeerTests
        excludes:
          - "Fixtures/**"
      - path: BudgeerTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Budgeer
    settings:
      base:
        PRODUCT_NAME: BudgeerTests
        GENERATE_INFOPLIST_FILE: "YES"

  # The widgets (WidgetKit): "This month" on the Home Screen and the Lock
  # Screen, and the Lock Screen's "+ Add". They show the snapshot the app
  # writes to the App Group (Budgeer/Widgets: WidgetSync); the extension runs
  # no core and no network. Its own sources plus the few app files it shares
  # (the snapshot, the faces, the colour tokens, the mark, the strings
  # lookup), the generated strings and the fonts. One entitlements file for
  # every configuration: the App Group only.
  BudgeerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BudgeerWidgets
      - path: Budgeer/Widgets/WidgetSnapshot.swift
      - path: Budgeer/Widgets/WidgetViews.swift
      - path: Budgeer/Theme/Theme.swift
      - path: Budgeer/Theme/NativeStyle.swift
      - path: Budgeer/Theme/BrandMarkCanvas.swift
      - path: Budgeer/Support/L10n.swift
      - path: Budgeer/Resources/Generated
        buildPhase: resources
      - path: Budgeer/Resources/Fonts
        buildPhase: resources
        excludes:
          - "*.txt"
    info:
      path: BudgeerWidgets/Info.plist
      properties:
        CFBundleDisplayName: $(BUDGEER_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, el]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Poppins-SemiBold.ttf
          - Poppins-Bold.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
        BudgeerAppGroup: $(BUDGEER_APP_GROUP)
    settings:
      base:
        PRODUCT_NAME: BudgeerWidgets
        # com.budgeer.app.dev.widgets or com.budgeer.app.widgets.
        PRODUCT_BUNDLE_IDENTIFIER: $(BUDGEER_BUNDLE_ID).widgets
        GENERATE_INFOPLIST_FILE: "NO"
        # The widgets on an iPhone and an iPad, as the app.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Config/BudgeerWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"

schemes:
  Budgeer Dev:
    build:
      targets:
        Budgeer: all
        BudgeerTests: [test]
      preActions:
        - name: Build the core and the strings
          settingsTarget: Budgeer
          script: |
            /bin/bash "$SRCROOT/scripts/prebuild.sh"
    run:
      config: Debug-Dev
    test:
      config: Debug-Dev
      targets: [BudgeerTests]
    profile:
      config: Release-Dev
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  Budgeer Prod:
    build:
      targets:
        Budgeer: all
      preActions:
        - name: Build the core and the strings
          settingsTarget: Budgeer
          script: |
            /bin/bash "$SRCROOT/scripts/prebuild.sh"
    run:
      config: Debug-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
