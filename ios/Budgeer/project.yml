# The Budgeer iOS app's Xcode project, generated by XcodeGen (never commit
# Budgeer.xcodeproj):  npm run ios:prepare   (core.js, the strings, then this)
# or, in this folder,  xcodegen generate
#
# Two environments, four configurations: Debug-Dev / Release-Dev point at the
# TEST Supabase project, Debug-Prod / Release-Prod at PROD (Config/*.xcconfig
# hold the URL and the public anon key; nothing in Swift). The "Budgeer Dev"
# scheme is the default; "Budgeer Prod" is for release builds only.
name: Budgeer
options:
  bundleIdPrefix: com.budgeer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  # Xcode 15 project format (object version 63): XcodeGen's default is
  # Xcode 16's, which Xcode 15.4 (CI) cannot open.
  projectFormat: xcode15_3
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Prod: debug
  Release-Prod: release

configFiles:
  Debug-Dev: Config/Dev.xcconfig
  Release-Dev: Config/Dev.xcconfig
  Debug-Prod: Config/Prod.xcconfig
  Release-Prod: Config/Prod.xcconfig

packages:
  BudgeerCore:
    path: ../BudgeerCore
  # Pinned: 2.49.0 is the last supabase-swift on Swift tools 5.10 (2.50+
  # needs Xcode 16.3's tools 6.1; CI pins Xcode 15.4 on macos-14).
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.49.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # No team yet: simulator builds and tests need none. A device build takes
    # the owner's DEVELOPMENT_TEAM (put it in Config/Local.xcconfig, ignored).
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Budgeer:
    type: application
    platform: iOS
    sources:
      - path: Budgeer
        excludes:
          # The fonts' licence texts stay in the repository, not in the app.
          - "Resources/Fonts/*.txt"
    dependencies:
      - package: BudgeerCore
      - package: Supabase
        product: Supabase
    info:
      path: Budgeer/Info.plist
      properties:
        CFBundleDisplayName: Budgeer
        CFBundleName: Budgeer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, el]
        CFBundleDevelopmentRegion: en
        UIAppFonts:
          - Poppins-Regular.ttf
          - Poppins-SemiBold.ttf
          - Poppins-Bold.ttf
          - NunitoSans-Regular.ttf
          - NunitoSans-SemiBold.ttf
          - NunitoSans-Bold.ttf
          - Manrope-Regular.ttf
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
        # From the xcconfig of the configuration being built (AppConfig.swift).
        BudgeerEnvironment: $(BUDGEER_ENV)
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgeer.app
        GENERATE_INFOPLIST_FILE: "NO"
    preBuildScripts:
      # The core and the strings must exist before anything compiles; the
      # scheme's pre-action builds them (scripts/prebuild.sh) and this phase
      # fails loudly if it did not run (a build started outside the scheme).
      - name: Check the core and the strings
        script: |
          /bin/bash "$SRCROOT/scripts/prebuild.sh" check
        basedOnDependencyAnalysis: false

  BudgeerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BudgeerTests
        excludes:
          - "Fixtures/**"
      - path: BudgeerTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Budgeer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Budgeer Dev:
    build:
      targets:
        Budgeer: all
        BudgeerTests: [test]
      preActions:
        - name: Build the core and the strings
          settingsTarget: Budgeer
          script: |
            /bin/bash "$SRCROOT/scripts/prebuild.sh"
    run:
      config: Debug-Dev
    test:
      config: Debug-Dev
      targets: [BudgeerTests]
    profile:
      config: Release-Dev
    analyze:
      config: Debug-Dev
    archive:
      config: Release-Dev
  Budgeer Prod:
    build:
      targets:
        Budgeer: all
      preActions:
        - name: Build the core and the strings
          settingsTarget: Budgeer
          script: |
            /bin/bash "$SRCROOT/scripts/prebuild.sh"
    run:
      config: Debug-Prod
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
