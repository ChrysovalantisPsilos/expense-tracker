# Minimal Supabase CLI config. Set project_id to your project ref after you
# create the project, or run `supabase link --project-ref <ref>`.
project_id = "expense-tracker"

[db]
major_version = 17

[functions.generate-report]
verify_jwt = true

[functions.send-invite]
verify_jwt = true

[functions.group-report]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.privacy-request]
verify_jwt = true

# Cron/webhook-driven functions authenticate via an x-cron-secret header in
# code (checked against Vault), not a caller JWT, so JWT verification is off.
# They fail closed without the config too, but the repo is the source of truth.
[functions.notify-user]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false

[functions.purge-inactive]
verify_jwt = false

[functions.privacy-emails]
verify_jwt = false

[functions.operator-digest]
verify_jwt = false
